<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">Refresh token and authentication session lifetimes</title>
  <desc id="desc">A timeline showing a thirty-day authentication session and three rotating refresh tokens. The final token is capped by the session's absolute expiration.</desc>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#111111"/>
    </marker>
    <style>
      .title { font: 700 28px Arial, Helvetica, sans-serif; fill: #111111; }
      .subtitle { font: 400 15px Arial, Helvetica, sans-serif; fill: #444444; }
      .axis { stroke: #111111; stroke-width: 2; }
      .tick { stroke: #111111; stroke-width: 1.5; }
      .guide { stroke: #b5b5b5; stroke-width: 1; stroke-dasharray: 5 5; }
      .label { font: 700 15px Arial, Helvetica, sans-serif; fill: #111111; }
      .day { font: 400 13px Arial, Helvetica, sans-serif; fill: #333333; text-anchor: middle; }
      .bar-session { fill: #111111; }
      .bar-token { fill: #ffffff; stroke: #111111; stroke-width: 2; }
      .bar-capped { fill: #e8e8e8; stroke: #111111; stroke-width: 2; }
      .bar-text-light { font: 700 14px Arial, Helvetica, sans-serif; fill: #ffffff; text-anchor: middle; }
      .bar-text-dark { font: 700 14px Arial, Helvetica, sans-serif; fill: #111111; text-anchor: middle; }
      .annotation { font: 400 14px Arial, Helvetica, sans-serif; fill: #111111; }
      .annotation-strong { font: 700 14px Arial, Helvetica, sans-serif; fill: #111111; }
      .callout { fill: #ffffff; stroke: #111111; stroke-width: 1.5; }
      .cutoff { stroke: #111111; stroke-width: 2.5; stroke-dasharray: 7 5; }
      .planned { stroke: #777777; stroke-width: 2; stroke-dasharray: 6 5; fill: none; }
    </style>
  </defs>

  <rect width="1200" height="660" fill="#ffffff"/>

  <text x="600" y="48" class="title" text-anchor="middle">Token and Session Lifetimes</text>
  <text x="600" y="76" class="subtitle" text-anchor="middle">Refresh-token rotation cannot extend the absolute lifetime of the login session</text>

  <!-- Plot guides -->
  <line x1="245" y1="120" x2="1080" y2="120" class="axis"/>

  <line x1="245" y1="112" x2="245" y2="128" class="tick"/>
  <line x1="384" y1="112" x2="384" y2="128" class="tick"/>
  <line x1="523" y1="112" x2="523" y2="128" class="tick"/>
  <line x1="663" y1="112" x2="663" y2="128" class="tick"/>
  <line x1="802" y1="112" x2="802" y2="128" class="tick"/>
  <line x1="941" y1="112" x2="941" y2="128" class="tick"/>
  <line x1="1080" y1="112" x2="1080" y2="128" class="tick"/>

  <text x="245" y="104" class="day">Day 0</text>
  <text x="384" y="104" class="day">Day 5</text>
  <text x="523" y="104" class="day">Day 10</text>
  <text x="663" y="104" class="day">Day 15</text>
  <text x="802" y="104" class="day">Day 20</text>
  <text x="941" y="104" class="day">Day 25</text>
  <text x="1080" y="104" class="day">Day 30</text>

  <line x1="245" y1="130" x2="245" y2="480" class="guide"/>
  <line x1="663" y1="130" x2="663" y2="480" class="guide"/>
  <line x1="1052" y1="130" x2="1052" y2="480" class="guide"/>
  <line x1="1080" y1="130" x2="1080" y2="525" class="cutoff"/>

  <!-- Labels -->
  <text x="215" y="187" class="label" text-anchor="end">Session</text>
  <text x="215" y="267" class="label" text-anchor="end">Refresh token 1</text>
  <text x="215" y="347" class="label" text-anchor="end">Refresh token 2</text>
  <text x="215" y="427" class="label" text-anchor="end">Refresh token 3</text>

  <!-- Session bar: day 0 to day 30 -->
  <rect x="245" y="158" width="835" height="48" rx="4" class="bar-session"/>
  <text x="663" y="188" class="bar-text-light">Authentication session · 30-day absolute lifetime</text>

  <!-- Token 1: day 0 to day 15 -->
  <rect x="245" y="238" width="418" height="48" rx="4" class="bar-token"/>
  <text x="454" y="268" class="bar-text-dark">Token 1 · issued Day 0</text>

  <!-- Token 2: day 14 to day 29 -->
  <rect x="635" y="318" width="417" height="48" rx="4" class="bar-token"/>
  <text x="844" y="348" class="bar-text-dark">Token 2 · issued Day 14</text>

  <!-- Token 3: day 28 to day 30, plus nominal continuation -->
  <rect x="1024" y="398" width="56" height="48" rx="4" class="bar-capped"/>
  <path d="M1080 422 H1145" class="planned"/>
  <text x="1010" y="417" class="annotation" text-anchor="end">Issued Day 28</text>
  <text x="1010" y="437" class="annotation" text-anchor="end">2 days remaining</text>

  <!-- Cutoff annotation -->
  <rect x="765" y="493" width="380" height="96" rx="5" class="callout"/>
  <text x="785" y="521" class="annotation-strong">Absolute session expiration · Day 30</text>
  <text x="785" y="546" class="annotation">Token 3 would normally remain valid for 15 days,</text>
  <text x="785" y="568" class="annotation">but its expiration is capped at the session boundary.</text>
  <path d="M1080 493 V462" class="axis" marker-end="url(#arrow)"/>

  <!-- Formula -->
  <rect x="245" y="510" width="450" height="64" rx="5" class="callout"/>
  <text x="470" y="536" class="annotation-strong" text-anchor="middle">Effective replacement lifetime</text>
  <text x="470" y="558" class="annotation" text-anchor="middle">min(token TTL, remaining session lifetime)</text>

  <!-- Legend -->
  <rect x="245" y="613" width="24" height="14" class="bar-token"/>
  <text x="279" y="625" class="annotation">Normal token lifetime</text>
  <rect x="474" y="613" width="24" height="14" class="bar-capped"/>
  <text x="508" y="625" class="annotation">Session-capped lifetime</text>
  <line x1="719" y1="620" x2="756" y2="620" class="planned"/>
  <text x="766" y="625" class="annotation">Unused configured lifetime</text>
</svg>
