<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Successful refresh token rotation sequence</title>
  <desc id="desc">A sequence diagram showing a client sending a refresh token to an API, JWT verification, and transactional refresh token rotation in a database.</desc>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#111111"/>
    </marker>
    <style>
      .title { font: 700 28px Arial, Helvetica, sans-serif; fill: #111111; }
      .subtitle { font: 400 15px Arial, Helvetica, sans-serif; fill: #444444; }
      .participant { fill: #ffffff; stroke: #111111; stroke-width: 2; }
      .participant-text { font: 700 17px Arial, Helvetica, sans-serif; fill: #111111; text-anchor: middle; }
      .lifeline { stroke: #777777; stroke-width: 1.5; stroke-dasharray: 7 7; }
      .message { stroke: #111111; stroke-width: 1.7; fill: none; marker-end: url(#arrow); }
      .return { stroke: #111111; stroke-width: 1.7; stroke-dasharray: 6 5; fill: none; marker-end: url(#arrow); }
      .message-text { font: 400 14px Arial, Helvetica, sans-serif; fill: #111111; text-anchor: middle; }
      .transaction { fill: #fafafa; stroke: #777777; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .transaction-label { font: 700 13px Arial, Helvetica, sans-serif; fill: #333333; }
      .note { fill: #ffffff; stroke: #111111; stroke-width: 1.3; }
      .note-text { font: 400 13px Arial, Helvetica, sans-serif; fill: #111111; text-anchor: middle; }
    </style>
  </defs>

  <rect width="1200" height="900" fill="#ffffff"/>

  <text x="600" y="48" class="title" text-anchor="middle">Successful Refresh Token Rotation</text>
  <text x="600" y="76" class="subtitle" text-anchor="middle">Session-scoped rotation performed as one database transaction</text>

  <!-- Participants -->
  <rect x="70" y="105" width="190" height="54" rx="4" class="participant"/>
  <rect x="365" y="105" width="190" height="54" rx="4" class="participant"/>
  <rect x="660" y="105" width="190" height="54" rx="4" class="participant"/>
  <rect x="955" y="105" width="190" height="54" rx="4" class="participant"/>

  <text x="165" y="138" class="participant-text">Client</text>
  <text x="460" y="138" class="participant-text">API</text>
  <text x="755" y="138" class="participant-text">JWT</text>
  <text x="1050" y="138" class="participant-text">Database</text>

  <!-- Lifelines -->
  <line x1="165" y1="159" x2="165" y2="835" class="lifeline"/>
  <line x1="460" y1="159" x2="460" y2="835" class="lifeline"/>
  <line x1="755" y1="159" x2="755" y2="835" class="lifeline"/>
  <line x1="1050" y1="159" x2="1050" y2="835" class="lifeline"/>

  <!-- Initial request and verification -->
  <line x1="165" y1="205" x2="460" y2="205" class="message"/>
  <text x="312" y="194" class="message-text">Send refresh-token cookie</text>

  <line x1="460" y1="260" x2="755" y2="260" class="message"/>
  <text x="607" y="249" class="message-text">Verify signature, expiry, and claims</text>

  <line x1="755" y1="310" x2="460" y2="310" class="return"/>
  <text x="607" y="299" class="message-text">Valid token JTI</text>

  <!-- Transaction boundary -->
  <rect x="405" y="342" width="700" height="390" rx="6" class="transaction"/>
  <rect x="422" y="329" width="178" height="28" class="note"/>
  <text x="511" y="348" class="transaction-label" text-anchor="middle">DATABASE TRANSACTION</text>

  <line x1="460" y1="385" x2="1050" y2="385" class="message"/>
  <text x="755" y="374" class="message-text">Find session associated with JTI</text>

  <line x1="460" y1="435" x2="1050" y2="435" class="message"/>
  <text x="755" y="424" class="message-text">Lock session row</text>

  <line x1="460" y1="485" x2="1050" y2="485" class="message"/>
  <text x="755" y="474" class="message-text">Lock and reread refresh-token row</text>

  <line x1="1050" y1="535" x2="460" y2="535" class="return"/>
  <text x="755" y="524" class="message-text">Session valid · token ACTIVE</text>

  <line x1="460" y1="585" x2="1050" y2="585" class="message"/>
  <text x="755" y="574" class="message-text">Mark old token ROTATED</text>

  <line x1="460" y1="635" x2="1050" y2="635" class="message"/>
  <text x="755" y="624" class="message-text">Insert replacement token</text>

  <line x1="460" y1="685" x2="1050" y2="685" class="message"/>
  <text x="755" y="674" class="message-text">Update session activity and last IP</text>

  <line x1="460" y1="715" x2="1050" y2="715" class="message"/>
  <text x="755" y="704" class="message-text">Commit</text>

  <!-- Response -->
  <line x1="460" y1="785" x2="165" y2="785" class="return"/>
  <text x="312" y="774" class="message-text">New access token + refresh cookie</text>

  <!-- Footer note -->
  <rect x="322" y="822" width="556" height="48" rx="4" class="note"/>
  <text x="600" y="842" class="note-text">The old refresh token is consumed exactly once.</text>
  <text x="600" y="859" class="note-text">The replacement token cannot outlive its parent session.</text>
</svg>
